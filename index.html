<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>迪迪和独独的多元宇宙</title>
  </head>
  <body>
    <div id="hud">
      <div class="title">迪迪和独独的多元宇宙</div>
      <div class="hint">
        <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 滚动</span>
        <span><kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd> 转头</span>
        <span><kbd>空格</kbd> 叫一声</span>
          <span><kbd>E</kbd> 兴奋 <kbd>C</kbd> 好奇</span>
          <span><kbd>Y</kbd> 点头 <kbd>N</kbd> 摇头 <kbd>Q</kbd> 受惊</span>
        <span><kbd>I</kbd> 看内部结构</span>
          <span>鼠标拖动 旋转视角 / 滚轮 缩放</span>
          <span><kbd>Tab</kbd> 切换操控 迪迪 / 独独</span>
          <span><kbd>U</kbd> 穿越宇宙</span>
      </div>
      <div id="hw-bar">
        <button type="button" id="btn-serial">连接串口</button>
        <button type="button" id="btn-ble">连接蓝牙</button>
          <button type="button" id="btn-cutaway">看内部结构</button>
          <button type="button" id="btn-switch">操控独独</button>
          <button type="button" id="btn-universe">宇宙：黄沙黄昏</button>
        <span id="hw-status">未连接（仅仿真）</span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
