<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>迪迪和独独的多元宇宙</title>
  </head>
  <body>
    <div id="portal-flash"></div>
    <div id="world-card">
      <div id="world-card-eyebrow" data-i18n="world.entering">进入</div>
      <div id="world-card-name"></div>
    </div>
    <div id="story"><span id="story-line"></span></div>
    <div id="race">
      <div id="race-timer">0.00s</div>
      <div id="race-sub">
        <span id="race-progress">0 / 8</span> · <span id="race-best" data-i18n="race.bestNone">最佳 —</span>
      </div>
      <div id="race-prompt" data-i18n="race.idle">驾驶迪迪穿过发光的门开始计时</div>
    </div>
    <div id="hud">
      <div class="title" data-i18n="app.title">迪迪和独独的多元宇宙</div>
      <div class="hint">
        <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> <span data-i18n="hint.move">滚动</span></span>
        <span><kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd> <span data-i18n="hint.look">转头</span></span>
        <span><kbd data-i18n="key.space">空格</kbd> <span data-i18n="hint.chirp">叫一声</span></span>
          <span><kbd>E</kbd> <span data-i18n="hint.excited">兴奋</span> <kbd>C</kbd> <span data-i18n="hint.curious">好奇</span></span>
          <span><kbd>Y</kbd> <span data-i18n="hint.yes">点头</span> <kbd>N</kbd> <span data-i18n="hint.no">摇头</span> <kbd>Q</kbd> <span data-i18n="hint.scared">受惊</span></span>
        <span><kbd>I</kbd> <span data-i18n="hint.cutaway">看内部结构</span></span>
          <span><kbd>R</kbd> <span data-i18n="hint.reset">重新计时</span></span>
          <span data-i18n="hint.camera">鼠标拖动 旋转视角 / 滚轮 缩放</span>
          <span><kbd>Tab</kbd> <span data-i18n="hint.switch">切换操控 迪迪 / 独独</span></span>
          <span><kbd>U</kbd> <span data-i18n="hint.universe">穿越宇宙</span></span>
      </div>
      <div id="hw-bar">
        <button type="button" id="btn-lang">EN</button>
        <button type="button" id="btn-serial" data-i18n="btn.serial">连接串口</button>
        <button type="button" id="btn-ble" data-i18n="btn.ble">连接蓝牙</button>
          <button type="button" id="btn-cutaway">看内部结构</button>
          <button type="button" id="btn-switch">操控独独</button>
          <button type="button" id="btn-universe">宇宙：黄沙黄昏</button>
        <span id="hw-status" data-i18n="hw.idle">未连接（仅仿真）</span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
